services:
  - type: web
    name: forge-ai-workspace
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: forge-ai-engine
          property: host
      - key: INTERNAL_SERVICE_SECRET
        generateValue: true

  - type: web
    name: forge-ai-engine
    env: python
    plan: free
    buildCommand: pip install -r ai/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir ai
    envVars:
      - key: INTERNAL_SERVICE_SECRET
        fromService:
          type: web
          name: forge-ai-workspace
          envVarKey: INTERNAL_SERVICE_SECRET
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
